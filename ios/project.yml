# XcodeGen spec, equivalent to Drifter.xcodeproj. Regenerate with `xcodegen generate`
# if the checked-in project ever needs rebuilding.
name: Drifter
options:
  bundleIdPrefix: com.whiringa
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Drifter:
    type: application
    platform: iOS
    sources:
      - Drifter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whiringa.drifter
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Drifter
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  DrifterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DrifterTests
    dependencies:
      - target: Drifter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whiringa.drifter.tests
        GENERATE_INFOPLIST_FILE: YES
